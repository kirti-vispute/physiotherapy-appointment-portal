<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Physiotherapy Appointment Portal</title>
    <style>
        :root { font-family: system-ui, sans-serif; color: #17324d; background: #f5fafb; }
        body { margin: 0; }
        header { background: #087e82; color: white; padding: 1.2rem max(1.5rem, calc((100vw - 900px)/2)); }
        main { max-width: 900px; margin: 4rem auto; padding: 0 1.5rem; }
        .card { background: white; border: 1px solid #d8e7e9; border-radius: 14px; padding: 2rem; box-shadow: 0 8px 30px #17324d0d; }
        h1 { margin-top: 0; font-size: clamp(2rem, 5vw, 3rem); }
        p { line-height: 1.6; }
        .badge { display: inline-block; padding: .35rem .7rem; border-radius: 999px; background: #e1f5f2; color: #086b67; font-weight: 700; }
    </style>
</head>
<body>
<header><strong>Physiotherapy Appointment Portal</strong></header>
<main>
    <section class="card">
        <span class="badge" data-testid="setup-status">Local setup</span>
        <h1>Appointment booking is being built</h1>
        <p>The application is running. Patient registration, physiotherapists, slots, booking, and cancellation will be added in later project tasks.</p>
    </section>
</main>
</body>
</html>
