<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Find a physiotherapist | PhysioWell</title><link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main id="main-content">
    <div class="page-intro">
        <span class="eyebrow">Find your fit</span>
        <h1>Find a physiotherapist</h1>
        <p class="lead">Explore areas of care, then choose an available appointment that suits your schedule.</p>
    </div>
    <p th:if="${#lists.isEmpty(providers)}" class="card empty-state" data-testid="providers-empty">No physiotherapists are available right now.</p>
    <div class="grid">
        <article class="card provider-card" th:each="provider : ${providers}" data-testid="physiotherapist-card" th:attr="data-provider-id=${provider.id}">
            <div class="provider-top">
                <span class="provider-avatar" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="14" r="7" fill="currentColor" opacity=".85"/><path d="M10 39c0-10 6-16 14-16s14 6 14 16" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M37 11v10m-5-5h10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></span>
                <h2 th:text="${provider.fullName}"></h2>
            </div>
            <span class="specialty" th:text="${provider.specialty}"></span>
            <p th:text="${provider.description}"></p>
            <a class="button button-arrow" th:href="@{/physiotherapists/{id}/slots(id=${provider.id})}" data-testid="view-slots">View available slots</a>
        </article>
    </div>
    <p class="demo-note">Physiotherapists, descriptions, and schedules shown here are fictional demo data.</p>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
